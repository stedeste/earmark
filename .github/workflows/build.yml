name: Build apps

# Runs when you push a version tag (e.g. v0.1.0) -> builds and attaches the
# apps to a GitHub Release. Can also be started by hand from the Actions tab
# (the builds then appear as downloadable artifacts on the run page).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (M1 and later)
            label: macOS-AppleSilicon
          - os: macos-15-intel      # Intel Macs
            label: macOS-Intel
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name Earmark \
            --osx-bundle-identifier uk.stefanodestefano.earmark \
            --add-data "ui:ui" earmark.py
          ditto -c -k --keepParent dist/Earmark.app "Earmark-${{ matrix.label }}.zip"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name Earmark --add-data "ui;ui" earmark.py
          Compress-Archive -Path dist/Earmark -DestinationPath "Earmark-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: Earmark-${{ matrix.label }}
          path: Earmark-${{ matrix.label }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          draft: true
          generate_release_notes: true

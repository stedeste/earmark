name: Build apps

# Runs when you push a version tag (e.g. v0.1.0) -> builds and attaches the
# apps to a GitHub Release. Can also be started by hand from the Actions tab
# (the builds then appear as downloadable artifacts on the run page).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon (M1 and later)
            label: macOS-AppleSilicon
          - os: macos-15-intel      # Intel Macs
            label: macOS-Intel
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name Earmark \
            --osx-bundle-identifier uk.stefanodestefano.earmark \
            --add-data "ui:ui" --icon icons/Earmark.icns earmark.py
          ditto -c -k --keepParent dist/Earmark.app "Earmark-${{ matrix.label }}.zip"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --name Earmark --add-data "ui;ui" --icon icons/Earmark.ico earmark.py
          Compress-Archive -Path dist/Earmark -DestinationPath "Earmark-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: Earmark-${{ matrix.label }}
          path: Earmark-${{ matrix.label }}.zip

  max:
    # The Max package: earmark-query/ ready to drop into Documents/Max 9/Packages,
    # with the one library it needs (sql.js) already installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the package
        run: |
          P=pkg/earmark-query
          mkdir -p "$P/code"
          cp max/earmark-node.js max/earmark-max.js max/package.json "$P/code/"
          cp max/README.md LICENSE "$P/"
          cd "$P/code"
          npm install --omit=dev --no-audit --no-fund
          # keep only the parts of sql.js that the script loads
          find node_modules/sql.js -mindepth 1 -maxdepth 1 ! -name dist ! -name package.json ! -name LICENSE -exec rm -rf {} +
          find node_modules/sql.js/dist -type f ! -name sql-wasm.js ! -name sql-wasm.wasm -delete
          rm -f package-lock.json node_modules/.package-lock.json
          cd ../..
          zip -r -X Earmark-Max.zip earmark-query

      - uses: actions/upload-artifact@v6
        with:
          name: Earmark-Max
          path: pkg/Earmark-Max.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, max]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          draft: true
          generate_release_notes: true
